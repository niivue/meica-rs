[package]
name = "meica-wasm"
description = "WebAssembly bindings for meica multi-echo ICA denoising"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["threads"]
# Web Worker threads through wasm-bindgen-rayon (needs a nightly build-std build; see
# js/scripts/build-wasm.mjs). Without it the build is single-threaded.
threads = ["dep:wasm-bindgen-rayon", "meica-core/parallel"]

[dependencies]
meica-core = { path = "../core", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
